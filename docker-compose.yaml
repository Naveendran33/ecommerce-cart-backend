services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-shop
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: naveen
      POSTGRES_PASSWORD: naveen@123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      my-ecommerce:
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U naveen -d ecommerce_db" ]
      interval: 5s
      timeout: 5s
      retries: 5


  app:
    build: .
    depends_on:
       postgres:
         condition: service_healthy

    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/ecommerce_db
      DB_USERNAME: naveen
      DB_PASSWORD: naveen@123
    ports:
      - "8080:8080"
    networks:
      my-ecommerce:

networks:
  my-ecommerce:

volumes:
  postgres_data:

